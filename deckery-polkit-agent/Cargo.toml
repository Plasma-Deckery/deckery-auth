[package]
name = "deckery-polkit-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "polkit authentication agent for Deckery — thin D-Bus wrapper that delegates auth to deckery-auth-daemon via Unix socket"

[[bin]]
name = "deckery-polkit-agent"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
