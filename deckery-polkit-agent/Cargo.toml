[package]
name = "deckery-polkit-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "polkit authentication agent for Deckery — controller PIN and password fallback via Layer Shell popup"

[[bin]]
name = "deckery-polkit-agent"
path = "src/main.rs"

[dependencies]
iced = "0.13.1"
iced_layershell = "0.13.7"
iced_runtime = "0.13.2"
glib = "0.20"
nix = { version = "0.30", features = ["process"] }
polkit-agent-rs = "0.3.0"
futures = "0.3"
zbus = "5"
anyhow = { workspace = true }
