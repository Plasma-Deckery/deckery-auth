[package]
name = "deckery-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Controller input library for Deckery — evdev reading and combo token stream"

[lib]
name = "deckery_input"
path = "src/lib.rs"

[[bin]]
name = "deckery-input-test"
path = "src/bin/test.rs"

[dependencies]
deckery-controller = { path = "../../makima-deckery/deckery-controller" }
evdev = { version = "0.12", features = ["tokio"] }
tokio = { workspace = true }
