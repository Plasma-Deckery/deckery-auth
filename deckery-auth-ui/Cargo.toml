[package]
name    = "deckery-auth-ui"
version = "0.1.0"
edition = "2021"

# Binary that subscribes to the auth daemon's display socket and renders
# a Layer Shell overlay showing controller PIN entry in real time.
# Connects to /run/deckery/display.sock (mode 0666, no root needed).

[[bin]]
name = "deckery-auth-ui"
path = "src/main.rs"

[dependencies]
cxx        = "1.0"
cxx-qt     = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
tokio      = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
anyhow     = "1"

[build-dependencies]
cxx-qt-build = "0.10"
