[package]
name = "deckery-pam"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PAM module authenticating sudo/polkit/lockscreen against the Deckery controller PIN"

[lib]
name = "pam_deckery"
crate-type = ["cdylib"]

[dependencies]
argon2 = { workspace = true }
anyhow = { workspace = true }
pamsm = { version = "0.5", features = ["libpam"] }
