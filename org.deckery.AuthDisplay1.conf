<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!--
    org.deckery.AuthDisplay1 — controller PIN session display interface.

    The daemon (root) owns this name and emits session events as D-Bus signals.
    The UI (user session) subscribes to those signals and may call UiCancel.

    Security model:
      · Only root may own the name → only the daemon can emit signals.
      · Any local user may receive signals (tokens are shown on-screen anyway).
      · Any local user may call UiCancel (session ID guards against spoofing).

    For multi-seat or shared-machine deployments, tighten the default policy
    with an at_console restriction or a dedicated group (e.g. deckery-auth).
  -->

  <!-- Service ownership: only root may claim this name. -->
  <policy user="root">
    <allow own="org.deckery.AuthDisplay1"/>
    <allow send_destination="org.deckery.AuthDisplay1"/>
  </policy>

  <!-- Any logged-in user may receive signals and call UiCancel. -->
  <policy context="default">
    <allow receive_sender="org.deckery.AuthDisplay1"/>
    <allow send_destination="org.deckery.AuthDisplay1"
           send_interface="org.deckery.AuthDisplay1"
           send_member="UiCancel"/>
  </policy>

</busconfig>
